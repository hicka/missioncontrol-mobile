# Each tab's large title shows, in whatever appearance the phone is set to.
appId: com.hicka.missioncontrol
---
- launchApp:
    clearState: true
- tapOn: "Look around with sample data"
- extendedWaitUntil:
    visible: ".*need you.*"
    timeout: 20000
- tapOn:
    text: "Tasks.*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: tasks
- tapOn:
    text: "Inbox.*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: inbox
- tapOn:
    text: "Settings.*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: settings
