# The App Store pictures: Home, the conversation, the Inbox, the tasks and one task.
appId: com.hicka.missioncontrol
---
- launchApp:
    clearState: true
- tapOn: "Look around with sample data"
- extendedWaitUntil:
    visible: "Needs you"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 1-home
- tapOn:
    text: "Chat.*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: 2-chat
- tapOn:
    text: "Inbox.*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: 3-inbox
- tapOn:
    text: "Tasks.*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: 4-tasks
# its card is further down the list; the card opens the task's own page
- scrollUntilVisible:
    element: "Open task: Fix the checkout rounding bug"
    direction: DOWN
- tapOn: "Open task: Fix the checkout rounding bug"
- waitForAnimationToEnd
- takeScreenshot: 5-task
