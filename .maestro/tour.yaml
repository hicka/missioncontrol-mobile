# Opens the sample data and takes a picture of every tab and the main pages.
appId: com.hicka.missioncontrol
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Look around with sample data"
    timeout: 30000
- takeScreenshot: 00-welcome
- tapOn: "Look around with sample data"
- extendedWaitUntil:
    visible: ".*need you.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 01-home
- tapOn:
    text: "Chat.*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: 02-chat
- tapOn:
    text: "Inbox.*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: 03-inbox
- tapOn:
    text: "Tasks.*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: 04-tasks
- tapOn: ".*Fix the checkout rounding bug.*"
- waitForAnimationToEnd
- takeScreenshot: 05-task
- tapOn: "Back"
- tapOn:
    text: "Settings.*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: 06-settings
- scroll
- takeScreenshot: 07-settings-more
- tapOn:
    text: "Atlas.*"
    index: 0
- tapOn: "Ask anything, or hand over a task"
- inputText: "What is left on the checkout fix?"
- tapOn: "Send"
- waitForAnimationToEnd
- takeScreenshot: 08-home-asked
